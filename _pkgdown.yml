reference:
  - title: "Trusted Third-Party (TTP) & PEP"
    desc: "Mainzelliste REST client with offline deterministic mode and AES-256-GCM / HMAC-SHA256 polymorphic pseudonymisation."
    contents:
      - ttp_mainzelliste_client
      - pep_derive_site_token
      - pep_rekey_pseudonym

  - title: "Privacy-Preserving Record Linkage (PPRL)"
    desc: "Frequency-hardened Bloom filters with randomized response bit-flipping, balanced constant-weight padding, and Dice linkage."
    contents:
      - pprl_encode_bloom
      - pprl_dice_similarity
      - pprl_link_cohorts

  - title: "Differential Privacy (DP) Federated Statistics"
    desc: "Formal (epsilon, delta)-DP privacy budget accountant, k-anonymity small-cell suppression, Laplace/Gaussian mechanisms, and federated aggregation."
    contents:
      - dp_budget_accountant
      - dp_suppress_small_cells
      - dp_laplace_mechanism
      - dp_gaussian_mechanism
      - dp_federated_summary
      - dp_aggregate_sites

  - title: "Federated Learning Site Exporters & Governance"
    desc: "Cryptographic site_admin outbound approval gate and ready-to-run site bundles for Flower, NVIDIA FLARE, and OpenFL."
    contents:
      - fl_site_approval_gate
      - fl_export_site_package
      - fl_capabilities
